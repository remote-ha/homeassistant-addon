name: Remote Home Assistant
version: "1.1.3"
slug: remote_home_assistant
description: >-
  A secure way back to your Home Assistant. Connect through an encrypted tunnel, choose who gets through, and keep control of your home.
url: https://remote-ha.com
image: ghcr.io/remote-ha/homeassistant-addon/agent
arch: [aarch64, amd64]
startup: services
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_title: Remote HA
panel_icon: mdi:home-lock
panel_admin: true
hassio_api: true
hassio_role: default
options:
  pairing_token: ""
schema:
  pairing_token: password
